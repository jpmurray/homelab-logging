name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check version
        run: |
          test "$GITHUB_REF_NAME" = "$(tr -d '[:space:]' < VERSION)" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION"
            exit 1
          }
      - name: Install rsyslog
        run: |
          sudo apt-get update
          sudo apt-get install -y rsyslog
          sudo install -d -o "$USER" -g "$USER" /etc/rsyslog.d/homelab-logging-tests
      - name: Test and package
        run: make package
        env:
          HLL_RSYSLOG_TEST_DIR: /etc/rsyslog.d/homelab-logging-tests
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
