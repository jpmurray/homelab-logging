name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install rsyslog
        run: |
          sudo apt-get update
          sudo apt-get install -y rsyslog
          sudo install -d -o "$USER" -g "$USER" /etc/rsyslog.d/homelab-logging-tests
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
        env:
          HLL_RSYSLOG_TEST_DIR: /etc/rsyslog.d/homelab-logging-tests
      - name: Build
        run: go build .
